name: gaza_gateway_phase13a_runtime

services:
  postgres-runtime:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: gza_admin
      POSTGRES_PASSWORD: gza_admin_proof_pass_123
      POSTGRES_DB: gaza_runtime_proof
    volumes:
      - ./docker/init-db-runtime.sh:/docker-entrypoint-initdb.d/init-db-runtime.sh:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gza_admin -d gaza_runtime_proof"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      backend-runtime-internal:
        aliases:
          - db.gazaairport.internal

  web:
    image: gaza-gateway-backend:phase13a-runtime
    build:
      context: .
      dockerfile: Dockerfile.production
    depends_on:
      postgres-runtime:
        condition: service_healthy
    ports:
      - "${APP_PORT_BINDING:-127.0.0.1:18086}:10000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s -H 'Host: api.gazaairport.com' http://127.0.0.1:10000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      PORT: 10000
      APP_NAME: "Gaza Gateway API"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?APP_KEY must be provided via environment or local ignored file. Generate with: php artisan key:generate --show}"
      APP_DEBUG: "false"
      APP_URL: "https://api.gazaairport.com"
      APP_VERSION: "${APP_VERSION:-1.0.0-phase13a-runtime}"
      APP_COMMIT: "${APP_COMMIT:-unreleased-runtime-proof}"
      APP_SCHEMA_VERSION: "${APP_SCHEMA_VERSION:-1}"
      APP_ALLOWED_HOSTS: "api.gazaairport.com"
      CORS_ALLOWED_ORIGINS: "https://www.gazaairport.com,https://gazaairport.com"
      DB_CONNECTION: pgsql
      DB_HOST: db.gazaairport.internal
      DB_PORT: 5432
      DB_DATABASE: gaza_runtime_proof
      DB_USERNAME: gza_runtime
      DB_PASSWORD: gza_runtime_proof_pass_2026
      DB_SSLMODE: require
      DB_CONNECT_TIMEOUT: 3
      DB_STATEMENT_TIMEOUT: 3000
      DB_LOCK_TIMEOUT: 3000
      CACHE_STORE: database
      CACHE_PREFIX: gza_runtime_cache_
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
    command: ["web"]
    networks:
      - backend-runtime-internal

  worker:
    image: gaza-gateway-backend:phase13a-runtime
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'queue:work' /proc/1/cmdline || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      APP_NAME: "Gaza Gateway API"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?APP_KEY must be provided via environment or local ignored file. Generate with: php artisan key:generate --show}"
      APP_DEBUG: "false"
      APP_URL: "https://api.gazaairport.com"
      APP_VERSION: "${APP_VERSION:-1.0.0-phase13a-runtime}"
      APP_COMMIT: "${APP_COMMIT:-unreleased-runtime-proof}"
      APP_SCHEMA_VERSION: "${APP_SCHEMA_VERSION:-1}"
      APP_ALLOWED_HOSTS: "api.gazaairport.com"
      DB_CONNECTION: pgsql
      DB_HOST: db.gazaairport.internal
      DB_PORT: 5432
      DB_DATABASE: gaza_runtime_proof
      DB_USERNAME: gza_runtime
      DB_PASSWORD: gza_runtime_proof_pass_2026
      DB_SSLMODE: require
      DB_CONNECT_TIMEOUT: 3
      DB_STATEMENT_TIMEOUT: 3000
      DB_LOCK_TIMEOUT: 3000
      CACHE_STORE: database
      CACHE_PREFIX: gza_runtime_cache_
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
    command: ["worker"]
    networks:
      - backend-runtime-internal

  migrator:
    image: gaza-gateway-backend:phase13a-runtime
    build:
      context: .
      dockerfile: Dockerfile.production
    profiles:
      - migration
    depends_on:
      postgres-runtime:
        condition: service_healthy
    environment:
      APP_NAME: "Gaza Gateway API"
      APP_ENV: production
      APP_KEY: "${APP_KEY:?APP_KEY must be provided via environment or local ignored file. Generate with: php artisan key:generate --show}"
      APP_DEBUG: "false"
      APP_URL: "https://api.gazaairport.com"
      APP_VERSION: "${APP_VERSION:-1.0.0-phase13a-runtime}"
      APP_COMMIT: "${APP_COMMIT:-unreleased-runtime-proof}"
      APP_SCHEMA_VERSION: "${APP_SCHEMA_VERSION:-1}"
      APP_ALLOWED_HOSTS: "api.gazaairport.com"
      DB_CONNECTION: pgsql
      DB_HOST: db.gazaairport.internal
      DB_PORT: 5432
      DB_DATABASE: gaza_runtime_proof
      DB_USERNAME: gza_migrator
      DB_PASSWORD: gza_migrator_proof_pass_2026
      DB_SSLMODE: require
      DB_CONNECT_TIMEOUT: 3
      DB_STATEMENT_TIMEOUT: 3000
      DB_LOCK_TIMEOUT: 3000
    command: ["migrate"]
    networks:
      - backend-runtime-internal

networks:
  backend-runtime-internal:
    driver: bridge
