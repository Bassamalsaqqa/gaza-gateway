name: gaza_gateway_phase13b_protocol02

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: gza_admin
      POSTGRES_PASSWORD: gza_local_secret
      POSTGRES_DB: gaza_gateway_dev
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - protocol02_pgdata:/var/lib/postgresql/data
    # Invariant: No published host ports; PostgreSQL is strictly internal to container network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gza_admin -d gaza_gateway_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - identity-protocol-internal

  app:
    image: gaza-gateway-backend:phase13a
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    environment:
      APP_NAME: "Gaza Gateway API"
      APP_ENV: local
      # Invariant: Strictly require fresh ignored APP_KEY; no hardcoded fallback
      APP_KEY: "${APP_KEY:?APP_KEY must be provided via environment or local ignored file. Generate with: php artisan key:generate --show}"
      APP_DEBUG: "false"
      APP_URL: "https://127.0.0.1:18090"
      APP_VERSION: "${APP_VERSION:-1.0.0-phase13b-protocol02}"
      APP_COMMIT: "${APP_COMMIT:-unreleased-protocol02}"
      APP_SCHEMA_VERSION: "${APP_SCHEMA_VERSION:-1}"
      APP_ALLOWED_HOSTS: "${APP_ALLOWED_HOSTS:-127.0.0.1,localhost,127.0.0.1:18090,localhost:18090}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:18090,http://127.0.0.1:18090}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gaza_gateway_dev
      DB_TEST_DATABASE: gaza_gateway_test
      DB_USERNAME: gaza_app_user
      DB_PASSWORD: gaza_app_local_pass
      CACHE_STORE: database
      CACHE_PREFIX: gza_protocol02_cache
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    networks:
      - identity-protocol-internal

  web:
    image: gaza-gateway-backend:phase13a-runtime
    entrypoint: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Isolated loopback HTTPS port 18090 bound to container port 10000
      - "${APP_PORT_BINDING:-127.0.0.1:18090}:10000"
    volumes:
      - ./:/var/www/html
      - ./docker/Caddyfile.identity:/etc/caddy/Caddyfile:ro
      - protocol02_caddy_data:/data
      - protocol02_caddy_config:/config
    environment:
      PORT: 10000
      APP_NAME: "Gaza Gateway API"
      APP_ENV: local
      # Invariant: Strictly require fresh ignored APP_KEY; no hardcoded fallback
      APP_KEY: "${APP_KEY:?APP_KEY must be provided via environment or local ignored file. Generate with: php artisan key:generate --show}"
      APP_DEBUG: "false"
      APP_URL: "https://127.0.0.1:18090"
      APP_VERSION: "${APP_VERSION:-1.0.0-phase13b-protocol02}"
      APP_COMMIT: "${APP_COMMIT:-unreleased-protocol02}"
      APP_SCHEMA_VERSION: "${APP_SCHEMA_VERSION:-1}"
      APP_ALLOWED_HOSTS: "${APP_ALLOWED_HOSTS:-127.0.0.1,localhost,127.0.0.1:18090,localhost:18090}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:18090,http://127.0.0.1:18090}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: gaza_gateway_dev
      DB_TEST_DATABASE: gaza_gateway_test
      DB_USERNAME: gaza_app_user
      DB_PASSWORD: gaza_app_local_pass
      CACHE_STORE: database
      CACHE_PREFIX: gza_protocol02_cache
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
    healthcheck:
      test: ["CMD-SHELL", "curl --ipv4 --cacert /data/caddy/pki/authorities/local/root.crt -f -s https://localhost:10000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - identity-protocol-internal

networks:
  identity-protocol-internal:
    driver: bridge

volumes:
  protocol02_pgdata:
  protocol02_caddy_data:
  protocol02_caddy_config:
