name: Published static package

on:
  push:
    branches: [phase10/durable-regression-ci-hardening]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Static branch integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export the static branch without development metadata
        run: |
          mkdir release-audit
          git archive origin/hostpapa-deploy | tar -x -C release-audit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
      - name: Verify committed package and source ancestry
        env:
          HOSTPAPA_RELEASE_DIR: release-audit
        run: |
          node scripts/verify-hostpapa-release.mjs
          source=$(cat release-audit/SOURCE_COMMIT.txt)
          git cat-file -e "$source^{commit}"
          git merge-base --is-ancestor "$source" origin/main
          git log -1 origin/hostpapa-deploy --format='Published static release: %H; parent: %P'
